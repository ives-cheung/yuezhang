plugins { id 'com.android.application' }

android {
    namespace 'com.ives.money'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ives.money'
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName '1.8.9'
        // Phone APK: retain the ABI used by modern ARM64 devices, including PKX110.
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
}


dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
